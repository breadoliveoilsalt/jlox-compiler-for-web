apiVersion: apps/v1
kind: Deployment
metadata:
  name: jlox-backend
  labels:
    app: jlox-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jlox-backend
  template:
    metadata:
      labels:
        app: jlox-backend
    spec:
      containers:
      - name: backend
        image: jlox-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

