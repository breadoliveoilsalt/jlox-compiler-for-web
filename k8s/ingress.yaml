apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jlox-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
    nginx.ingress.kubernetes.io/use-regex: 'true'
spec:
  ingressClassName: nginx
  rules:
    - host: jlox.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: jlox-backend-service
                port:
                  number: 3001
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: jlox-frontend-service
                port:
                  number: 80
