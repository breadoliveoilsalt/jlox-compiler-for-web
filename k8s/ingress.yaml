apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jlox-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: jlox.local # For local development
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: jlox-backend-service
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jlox-frontend-service
                port:
                  number: 80
